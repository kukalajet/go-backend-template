version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/postgres/sqlcgen
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
