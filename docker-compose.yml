name: go-backend-template

x-app: &app
  image: go-backend-template
  build: .

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
  WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
  WORKER_PASS_TIMEOUT: ${WORKER_PASS_TIMEOUT:-30s}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgresql:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      # TCP on purpose: the image's first-run init server listens only on a socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["/app/migrate", "up"]
    profiles: [app, tools]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
    depends_on:
      postgresql:
        condition: service_healthy

  api:
    <<: *app
    command: ["/app/api"]
    profiles: [app]
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - 127.0.0.1:${API_PORT}:8000
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["/app/worker"]
    profiles: [app]
    restart: unless-stopped
    stop_grace_period: 15s
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-once:
    <<: *app
    command: ["/app/worker", "-once"]
    profiles: [tools]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgresql-data:
